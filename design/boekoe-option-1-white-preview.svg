  <rect width="900" height="700" fill="#eeeae6"/>
  <text x="450" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#231f20">Optie 1 · aangepast</text>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6b6460">wit icoon • twee rode balletjes</text>
  <g transform="translate(230 150)">
