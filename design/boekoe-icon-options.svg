<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
  <title>Boekoe icon concepts</title>
  <desc>Zes abstracte rood-witte icoonvarianten met twee ogen, genummerd 1 tot en met 6.</desc>
  <rect width="1200" height="860" fill="#f6f3ef"/>
  <text x="600" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#231f20">Kies het Boekoe-icoon</text>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b6460">abstract • twee ogen • geen duidelijke koe</text>

  <!-- Optie 1: de huidige richting, verfijnd -->
  <g transform="translate(90 150)">
    <rect width="280" height="280" rx="64" fill="#c6283d"/>
    <rect x="64" y="58" width="152" height="164" rx="46" fill="#fff"/>
    <circle cx="112" cy="140" r="20" fill="#c6283d"/>
    <circle cx="168" cy="140" r="20" fill="#c6283d"/>
    <circle cx="140" cy="140" r="8" fill="#fff" opacity=".9"/>
    <text x="140" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#231f20">1 · Soft</text>
  </g>

  <!-- Optie 2: strakker en moderner -->
  <g transform="translate(460 150)">
    <rect width="280" height="280" rx="64" fill="#c6283d"/>
    <path d="M72 92Q72 62 102 62H178Q208 62 208 92V190Q208 218 180 218H100Q72 218 72 190Z" fill="#fff"/>
    <rect x="101" y="119" width="25" height="44" rx="12.5" fill="#c6283d"/>
    <rect x="154" y="119" width="25" height="44" rx="12.5" fill="#c6283d"/>
    <text x="140" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#231f20">2 · Modern</text>
  </g>

  <!-- Optie 3: vriendelijke capsule -->
  <g transform="translate(830 150)">
    <rect width="280" height="280" rx="64" fill="#c6283d"/>
    <rect x="48" y="89" width="184" height="102" rx="51" fill="#fff"/>
    <circle cx="110" cy="140" r="20" fill="#c6283d"/>
    <circle cx="170" cy="140" r="20" fill="#c6283d"/>
    <text x="140" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#231f20">3 · Capsule</text>
  </g>

  <!-- Optie 4: pixelachtig zonder dierkenmerken -->
  <g transform="translate(90 510)">
    <rect width="280" height="280" rx="64" fill="#c6283d"/>
    <path d="M76 68H204V92H228V212H204V236H76V212H52V92H76Z" fill="#fff"/>
    <rect x="92" y="120" width="32" height="40" rx="4" fill="#c6283d"/>
    <rect x="156" y="120" width="32" height="40" rx="4" fill="#c6283d"/>
    <text x="140" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#231f20">4 · Pixel</text>
  </g>

  <!-- Optie 5: open boek + ogen, subtiel gekoppeld aan de naam -->
  <g transform="translate(460 510)">
    <rect width="280" height="280" rx="64" fill="#c6283d"/>
    <path d="M42 76Q92 64 140 98Q188 64 238 76V206Q188 194 140 224Q92 194 42 206Z" fill="#fff"/>
    <path d="M140 98V224" stroke="#c6283d" stroke-width="12" stroke-linecap="round"/>
    <circle cx="100" cy="140" r="17" fill="#c6283d"/>
    <circle cx="180" cy="140" r="17" fill="#c6283d"/>
    <text x="140" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#231f20">5 · Buku</text>
  </g>

  <!-- Optie 6: minimalistische negatieve ruimte -->
  <g transform="translate(830 510)">
    <rect width="280" height="280" rx="64" fill="#c6283d"/>
    <circle cx="140" cy="140" r="88" fill="#fff"/>
    <circle cx="108" cy="140" r="19" fill="#c6283d"/>
    <circle cx="172" cy="140" r="19" fill="#c6283d"/>
    <path d="M140 52V228" stroke="#c6283d" stroke-width="12" stroke-linecap="round" opacity=".14"/>
    <text x="140" y="324" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#231f20">6 · Minimal</text>
  </g>
</svg>
